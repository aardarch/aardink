####################################################################################################
# VERSIONS
####################################################################################################
[versions]

# Plugin versions
plugin-agp = "9.4.0"
plugin-kotlin = "2.4.20"
plugin-spotless = "8.10.2"
plugin-vanniktech-maven-publish = "0.37.0"
plugin-dokka = "2.2.0"
plugin-roborazzi = "1.74.0" # https://github.com/takahirom/roborazzi/releases
plugin-compose-multiplatform = "1.12.0" # https://github.com/JetBrains/compose-multiplatform/releases

# Major version definitions
jvm = "21"

# BOMs
androidx-compose-bom = "2026.09.00"

# Library versions
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
google-material = "1.14.0"
junit-jupiter = "6.1.3"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
robolectric = "4.17" # https://github.com/robolectric/robolectric/releases

####################################################################################################
# LIBRARIES
####################################################################################################
[libraries]

# BOMs
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }

# JETPACK/ANDROIDX - COMPOSE BOM MODULES
androidx-compose-foundation-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-foundation-foundation-layout = { module = "androidx.compose.foundation:foundation-layout" }
androidx-compose-material3-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-runtime-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-runtime-runtime-saveable = { module = "androidx.compose.runtime:runtime-saveable" }
androidx-compose-ui-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-ui-geometry = { module = "androidx.compose.ui:ui-geometry" }
androidx-compose-ui-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-ui-tooling-data = { module = "androidx.compose.ui:ui-tooling-data" }
androidx-compose-ui-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-ui-unit = { module = "androidx.compose.ui:ui-unit" }
androidx-compose-ui-ui-util = { module = "androidx.compose.ui:ui-util" }
androidx-compose-ui-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Activity / Lifecycle (sample app only)
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Google Material (sample app theme)
google-android-material = { module = "com.google.android.material:material", version.ref = "google-material" }

# KotlinX (languages-lsp only — JSON-RPC payloads and the transport's coroutines)
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# JUnit 5
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# kotlin.test — used in commonTest for KMP modules; the JUnit 5 engine above still runs them on
# jvmTest via kotlin-test-junit5's bridge.
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "plugin-kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "plugin-kotlin" }

# Screenshot capture (sample app only) — Roborazzi renders Compose on the JVM via Robolectric
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "plugin-roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "plugin-roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "plugin-roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

####################################################################################################
# BUNDLES
####################################################################################################
[bundles]
compose-core = [
    "androidx-compose-foundation-foundation",
    "androidx-compose-foundation-foundation-layout",
    "androidx-compose-material3-material3",
    "androidx-compose-runtime-runtime",
    "androidx-compose-runtime-runtime-saveable",
    "androidx-compose-ui-ui",
    "androidx-compose-ui-ui-geometry",
    "androidx-compose-ui-ui-graphics",
    "androidx-compose-ui-ui-tooling-preview",
    "androidx-compose-ui-ui-unit",
    "androidx-compose-ui-ui-util",
]
compose-debug = [
    "androidx-compose-ui-ui-tooling",
    "androidx-compose-ui-ui-tooling-data",
]
testing-screenshot = [
    "roborazzi",
    "roborazzi-compose",
    "roborazzi-junit-rule",
    "robolectric",
]

####################################################################################################
# PLUGINS
####################################################################################################
[plugins]

# Android
plugin-android-application = { id = "com.android.application", version.ref = "plugin-agp" }

# Kotlin
plugin-kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "plugin-kotlin" }
plugin-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "plugin-kotlin" }
plugin-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "plugin-kotlin" }

# Android KMP library (AGP 9's replacement for com.android.library inside a KMP module)
plugin-android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "plugin-agp" }

# Compose Multiplatform (adds jvm/wasmJs targets to the compose.* accessors already used via
# the AndroidX Compose BOM on androidTarget)
plugin-compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "plugin-compose-multiplatform" }

# Code formatting
plugin-spotless = { id = "com.diffplug.spotless", version.ref = "plugin-spotless" }

# Documentation
plugin-dokka = { id = "org.jetbrains.dokka", version.ref = "plugin-dokka" }

# Screenshot capture
plugin-roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "plugin-roborazzi" }

# Publishing
plugin-vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "plugin-vanniktech-maven-publish" }
