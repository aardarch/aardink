# JVM Arguments
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g

# AndroidX Configuration
android.useAndroidX=true
android.nonTransitiveRClass=true
# :editor, :languages and :languages-lsp keep commonTest without `withHostTest {}` on purpose:
# every test already runs on jvmTest and wasmJsBrowserTest (see docs/KMP_MIGRATION_PLAN.md).
# This silences the KMP AGP plugin's "android host tests are not enabled" warning. The second
# value silences AGP's own "this option is experimental" warning about the first, as AGP asks.
android.sync.suppressAgpWarnings=GENERIC,UNSUPPORTED_PROJECT_OPTION_USE
# "Configuration 'wasmJsNpmAggregated' was resolved during configuration time" on a configuration
# cache miss is KGP resolving its npm configurations eagerly (KT-60466, open). Not fixable here.

# Kotlin Settings
kotlin.code.style=official
# No native targets, so there is nothing to commonize and the check is pure overhead.
kotlin.mpp.enableCInteropCommonization=false
kotlin.incremental=true
# 4g, not 2g: linking the wasmJs test executables (each bundles Compose + Skiko) for all four
# libraries in one build ran the daemon out of heap at 2g, even with --no-parallel.
kotlin.daemon.jvmargs=-Xmx4g

# Suppress compile SDK warning until AGP officially supports SDK 37
# android.suppressUnsupportedCompileSdk=37.0

# Build Configuration
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# R8 full mode for better shrinking
android.enableR8.fullMode=true

# Published artifact coordinates (consumed by vanniktech maven-publish)
GROUP=com.aardarch
VERSION_NAME=0.8.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
