# JVM Arguments
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g

# AndroidX Configuration
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g

# Suppress compile SDK warning until AGP officially supports SDK 37
# android.suppressUnsupportedCompileSdk=37.0

# Build Configuration
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# R8 full mode for better shrinking
android.enableR8.fullMode=true

# Published artifact coordinates (consumed by vanniktech maven-publish)
GROUP=com.aardarch
VERSION_NAME=0.3.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
