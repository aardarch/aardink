name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run checks before publish
        run: ./gradlew :editor:test :editor:apiCheck :editor:lint

      - name: Publish to GitHub Packages
        run: ./gradlew :editor:publishAllPublicationsToGitHubPackagesRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.GITHUB_TOKEN }}
