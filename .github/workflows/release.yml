name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-provider: basic # MIT-licensed

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify tag matches VERSION_NAME
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          props_version="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "Tag version:        $tag_version"
          echo "gradle.properties:  $props_version"
          if [ "$tag_version" != "$props_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$props_version in gradle.properties."
            exit 1
          fi

      # jvmTest, not `test`: the KMP libraries register no aggregate `test` task and no
      # `lint` task at all. wasmJs browser tests are covered by CI on every PR and need a
      # Chrome install, so a release tag re-runs only the JVM half plus the Android gates.
      - name: Run checks before publish
        run: ./gradlew checkAbiAll :editor:jvmTest :languages:jvmTest :languages-lsp:jvmTest :sample:lintDebug :sample:verifyRoborazziDebug

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # HTML, not GFM: Dokka 2's Gradle plugin does not support the Markdown/GFM format
      # (the task reports success but emits zero files), so dokkaAllGfm is gone. The AGP 9
      # androidComponents noise filter that used to wrap this step is gone too -- the three
      # modules are multiplatform now, so Dokka's KGP adapter handles them directly and
      # never touches the Android model.
      - name: Generate API docs
        run: ./gradlew dokkaAll

      - name: Bundle API docs
        id: docs
        run: |
          staging="$(mktemp -d)"
          mkdir -p "$staging/aardink-docs/editor" "$staging/aardink-docs/languages" "$staging/aardink-docs/languages-lsp" "$staging/aardink-docs/editor-web"
          cp -R editor/build/dokka/html/. "$staging/aardink-docs/editor/"
          cp -R languages/build/dokka/html/. "$staging/aardink-docs/languages/"
          cp -R languages-lsp/build/dokka/html/. "$staging/aardink-docs/languages-lsp/"
          cp -R editor-web/build/dokka/html/. "$staging/aardink-docs/editor-web/"
          archive="aardink-docs-${GITHUB_REF_NAME}.tgz"
          tar -czf "$archive" -C "$staging" aardink-docs
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Build sample APK
        id: apk
        run: |
          ./gradlew :sample:assembleRelease
          apk="aardink-sample-${GITHUB_REF_NAME}.apk"
          cp sample/build/outputs/apk/release/sample-release.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      # A browser build of the harness, for trying a tagged release without a Vite project:
      # unzip and serve the folder with any static file server.
      - name: Build web sample
        id: web
        run: |
          ./gradlew :sample-web:wasmJsBrowserDistribution
          archive="aardink-sample-web-${GITHUB_REF_NAME}.zip"
          (cd sample-web/build/dist/wasmJs/productionExecutable && zip -qr "$GITHUB_WORKSPACE/$archive" .)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            in_section && /^## \[/    { exit }
            in_section                { print }
          ' CHANGELOG.md > "$notes_file"
          if ! [ -s "$notes_file" ]; then
            echo "::error::No ## [$version] section found in CHANGELOG.md (or it was empty)."
            exit 1
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --verify-tag \
            "${{ steps.docs.outputs.archive }}" \
            "${{ steps.apk.outputs.apk }}#Sample app (APK, debug-signed)"             "${{ steps.web.outputs.archive }}#Web sample (static files)"
