name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-provider: basic # MIT-licensed

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify tag matches VERSION_NAME
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          props_version="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "Tag version:        $tag_version"
          echo "gradle.properties:  $props_version"
          if [ "$tag_version" != "$props_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$props_version in gradle.properties."
            exit 1
          fi

      - name: Run checks before publish
        run: ./gradlew :editor:test :editor:lint :languages:test :languages:lint

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Generate API docs (GFM)
        # Dokka's Android adapter can't read AGP 9's `androidComponents` extension
        # (classloader mismatch under `android.newDsl=true`); it logs a benign warning
        # while our convention plugin configures the source set manually. No upstream fix
        # exists at Dokka 2.2.0 — see Kotlin/dokka#4256 and #4439. Filter the known noise
        # lines (pipefail keeps a real Gradle failure fatal). Drop this once Dokka ships
        # AGP 9 support.
        run: |
          set -o pipefail
          ./gradlew dokkaAllGfm 2>&1 | grep -vE \
            'failed to get extension androidComponents|Please make sure plugins in all subprojects are consistent|^  Applied plugins:|^  Available extensions:'

      - name: Bundle API docs
        id: docs
        run: |
          staging="$(mktemp -d)"
          mkdir -p "$staging/aardink-docs/editor" "$staging/aardink-docs/languages"
          cp -R editor/build/dokka/markdown/. "$staging/aardink-docs/editor/"
          cp -R languages/build/dokka/markdown/. "$staging/aardink-docs/languages/"
          archive="aardink-docs-${GITHUB_REF_NAME}.tgz"
          tar -czf "$archive" -C "$staging" aardink-docs
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Build sample APK
        id: apk
        run: |
          ./gradlew :sample:assembleRelease
          apk="aardink-sample-${GITHUB_REF_NAME}.apk"
          cp sample/build/outputs/apk/release/sample-release.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            in_section && /^## \[/    { exit }
            in_section                { print }
          ' CHANGELOG.md > "$notes_file"
          if ! [ -s "$notes_file" ]; then
            echo "::error::No ## [$version] section found in CHANGELOG.md (or it was empty)."
            exit 1
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --verify-tag \
            "${{ steps.docs.outputs.archive }}"
