name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: true

jobs:
  check:
    name: Lint, format, test, API check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-provider: basic # MIT-licensed

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Spotless check
        run: ./gradlew :editor:spotlessCheck :languages:spotlessCheck :languages-lsp:spotlessCheck :sample:spotlessCheck

      - name: Lint
        run: ./gradlew :editor:lint :languages:lint :languages-lsp:lint :sample:lintDebug

      - name: Unit tests
        run: ./gradlew :editor:test :languages:test :languages-lsp:test

      - name: Build sample app (debug + release)
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease

      - name: Upload sample APKs
        uses: actions/upload-artifact@v7
        with:
          name: sample-apks
          path: |
            sample/build/outputs/apk/debug/*.apk
            sample/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            editor/build/reports/tests/
            languages/build/reports/tests/
            languages-lsp/build/reports/tests/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: |
            editor/build/reports/lint-results-*.html
            languages/build/reports/lint-results-*.html
            languages-lsp/build/reports/lint-results-*.html
            sample/build/reports/lint-results-*.html
