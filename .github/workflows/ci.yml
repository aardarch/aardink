name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: true

jobs:
  check:
    name: Lint, format, test, API check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Karma launches headless Chrome for the wasmJs browser tests below and finds the
      # binary through CHROME_BIN.
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-provider: basic # MIT-licensed

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Spotless check
        run: ./gradlew :editor:spotlessCheck :languages:spotlessCheck :languages-lsp:spotlessCheck :editor-web:spotlessCheck :sample:spotlessCheck

      # Only :sample runs Android Lint. The three libraries are now
      # com.android.kotlin.multiplatform.library modules, and that plugin registers no `lint`
      # task at all (verified with `./gradlew :editor:tasks --all`) — the previous
      # `:editor:lint :languages:lint :languages-lsp:lint` line is why this workflow has been
      # failing since PR 3. Revisit if AGP adds lint support for KMP library modules.
      - name: Lint
        run: ./gradlew :sample:lintDebug

      # Fails on any public ABI change not reflected in the committed dumps under
      # */api/. Every PR through to 0.5.0 must show a purely additive diff.
      - name: ABI check
        run: ./gradlew checkAbiAll

      - name: JVM unit tests
        run: ./gradlew :editor:jvmTest :languages:jvmTest :languages-lsp:jvmTest

      - name: wasmJs browser tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: ./gradlew :editor:wasmJsBrowserTest :languages:wasmJsBrowserTest :languages-lsp:wasmJsBrowserTest :editor-web:wasmJsBrowserTest

      # verifyRoborazziDebug, not testDebugUnitTest: the plain test task re-renders the
      # screenshots but compares them against nothing. verifyRoborazziDebug runs the same
      # tests in compare mode against the committed baselines under screenshots/.
      - name: Build sample app (debug + release) and verify screenshots
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease :sample:verifyRoborazziDebug

      - name: Upload sample APKs
        uses: actions/upload-artifact@v7
        with:
          name: sample-apks
          path: |
            sample/build/outputs/apk/debug/*.apk
            sample/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            editor/build/reports/tests/
            languages/build/reports/tests/
            languages-lsp/build/reports/tests/
            editor-web/build/reports/tests/
            sample/build/reports/tests/

      # Roborazzi writes the actual-vs-expected comparison images here when a screenshot
      # test fails; without them a red build says only that pixels moved, not how.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: sample/build/outputs/roborazzi/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: sample/build/reports/lint-results-*.html
