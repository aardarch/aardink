name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: true

jobs:
  check:
    name: Lint, format, test, API check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Karma launches headless Chrome for the wasmJs browser tests below and finds the
      # binary through CHROME_BIN.
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      # Ubuntu 24.04 runners block unprivileged user namespaces through AppArmor, so Chrome
      # aborts with "No usable sandbox!". Lifting the restriction keeps Chrome's sandbox on,
      # unlike launching it with --no-sandbox.
      - name: Allow the Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-provider: basic # MIT-licensed

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Spotless check
        run: ./gradlew :editor:spotlessCheck :languages:spotlessCheck :languages-lsp:spotlessCheck :editor-web:spotlessCheck :sample:spotlessCheck :sample-web:spotlessCheck :sample-benchmark:spotlessCheck

      # Only :sample runs Android Lint. The three libraries are now
      # com.android.kotlin.multiplatform.library modules, and that plugin registers no `lint`
      # task at all (verified with `./gradlew :editor:tasks --all`) — the previous
      # `:editor:lint :languages:lint :languages-lsp:lint` line is why this workflow has been
      # failing since PR 3. Revisit if AGP adds lint support for KMP library modules.
      - name: Lint
        run: ./gradlew :sample:lintDebug

      # Fails on any public ABI change not reflected in the committed dumps under
      # */api/. On the 0.6 line every change must be in docs/AARDINK_0.6_PLAN.md section 5.
      - name: ABI check
        run: ./gradlew checkAbiAll

      - name: JVM unit tests
        run: ./gradlew :editor:jvmTest :languages:jvmTest :languages-lsp:jvmTest

      # The editor on the 5,000-line reference document on the desktop JVM, as the web gate
      # below measures it in Chrome (docs/AARDINK_ROADMAP.md section 8.4). On its own, after the
      # unit tests, so nothing else runs while it times. Writes editor/build/perf-jvm.json.
      - name: JVM performance
        run: ./gradlew :editor:jvmPerfTest

      - name: wasmJs browser tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: ./gradlew :editor:wasmJsBrowserTest :languages:wasmJsBrowserTest :languages-lsp:wasmJsBrowserTest :editor-web:wasmJsBrowserTest

      # verifyRoborazziDebug, not testDebugUnitTest: the plain test task re-renders the
      # screenshots but compares them against nothing. verifyRoborazziDebug runs the same
      # tests in compare mode against the committed baselines under screenshots/.
      - name: Build sample app (debug + release) and verify screenshots
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease :sample:verifyRoborazziDebug

      # The browser harness, the @aardarch/aardink-web npm package, and the check that the
      # running Exports.kt still matches the template consumers copy.
      - name: Build web sample and npm package
        run: ./gradlew :sample-web:wasmJsBrowserDistribution :sample-web:npmPackage :sample-web:verifyExportsMatchTemplate

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A real Vite app installs the npm package, builds, and runs it in headless Chrome: every
      # in-page check must pass and no request (a .wasm, the font) may fail.
      - name: Vite smoke test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        working-directory: tools/vite-smoke
        run: |
          pnpm install --frozen-lockfile
          pnpm smoke

      # aardink-web.wasm and skiko.wasm against the gzipped sizes recorded in bundle-size.json,
      # plus 2% (docs/AARDINK_ROADMAP.md section 16). Also reports the Brotli sizes.
      - name: Bundle size ceiling
        working-directory: tools/vite-smoke
        run: node bundle-size.mjs

      # What npm and bundlers will see: the file list, package.json correctness (publint) and
      # that the types resolve for ESM consumers (arethetypeswrong). The release job runs the same.
      - name: Check the npm package
        working-directory: sample-web/build/npm
        run: |
          npm pack --dry-run
          npx --yes publint@0.3 --strict
          npx --yes @arethetypeswrong/cli@0.18 --pack --profile esm-only

      # Latency on the 5,000-line reference document (docs/AARDINK_0.6_PLAN.md section 6). Fails
      # the build when a measurement misses its gate (looser than the target, for shared runners).
      - name: Web performance
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        working-directory: tools/vite-smoke
        run: node perf.mjs --gate --keys 20

      # The same document with inlay hints and code lenses from a registered language's providers,
      # and with a language server's semantic tokens (docs/AARDINK_ROADMAP.md section 8.4).
      - name: Web performance with hints and lenses
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        working-directory: tools/vite-smoke
        run: node perf.mjs --hints --gate --keys 20

      - name: Web performance with a language server's semantic tokens
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        working-directory: tools/vite-smoke
        run: node perf.mjs --semantic --gate --keys 20

      - name: Upload web sample
        uses: actions/upload-artifact@v7
        with:
          name: sample-web-dist
          path: |
            sample-web/build/dist/wasmJs/productionExecutable
            tools/vite-smoke/dist/smoke.png
            tools/vite-smoke/dist/perf.json
            tools/vite-smoke/dist/perf-hints.json
            tools/vite-smoke/dist/perf-semantic.json
            tools/vite-smoke/dist/bundle-size.json
            editor/build/perf-jvm.json
          retention-days: 14

      - name: Upload sample APKs
        uses: actions/upload-artifact@v7
        with:
          name: sample-apks
          path: |
            sample/build/outputs/apk/debug/*.apk
            sample/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            editor/build/reports/tests/
            languages/build/reports/tests/
            languages-lsp/build/reports/tests/
            editor-web/build/reports/tests/
            tools/vite-smoke/dist/smoke.png
            sample/build/reports/tests/

      # Roborazzi writes the actual-vs-expected comparison images here when a screenshot
      # test fails; without them a red build says only that pixels moved, not how.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: sample/build/outputs/roborazzi/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: sample/build/reports/lint-results-*.html

  # The Android gate (docs/AARDINK_ROADMAP.md section 16, "Android performance"): :sample's
  # cold start and its frames while typing and scrolling, for main and for the change, measured
  # one after the other on the same emulator, since an emulator's timings are only comparable
  # with its own. tools/android-perf/compare.mjs fails the job when the change is slower than
  # main by more than its tolerance. Also generates the change's baseline profile. Pull requests
  # only: on main itself there is nothing to compare with.
  android-perf:
    name: Android performance (emulator)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the change
        uses: actions/checkout@v7
        with:
          path: change

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-provider: basic # MIT-licensed

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The emulator needs hardware acceleration, which the runner's KVM gives once it is open.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x change/gradlew main/gradlew change/tools/android-perf/run.sh

      - name: Benchmarks and baseline profile on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: change
          script: tools/android-perf/run.sh "$GITHUB_WORKSPACE/main" "$GITHUB_WORKSPACE/change" "$GITHUB_WORKSPACE/results"

      - name: Compare with main
        working-directory: results
        run: node "$GITHUB_WORKSPACE/change/tools/android-perf/compare.mjs" main change

      - name: Upload Android performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-perf
          path: results/
          retention-days: 14
